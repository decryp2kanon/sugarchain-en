name: Windows wallet URI delivery
on:
  push:
    branches: [qa/windows-payment-delivery-20261120]
permissions:
  contents: read
jobs:
  payment:
    name: Windows wallet URI delivery
    runs-on: windows-2022
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt 6.8.3 for MSVC
        id: qt
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "${RUNNER_TEMP}/payment-sdk" --archives qtbase
      - name: Verify write connection and normal wallet response
        if: "!cancelled() && steps.qt.outcome == 'success'"
        shell: bash
        run: python .github/ci-payment-qt-comparison.py write normal
      - name: Verify write connection and delayed wallet response
        if: "!cancelled() && steps.qt.outcome == 'success'"
        shell: bash
        run: python .github/ci-payment-qt-comparison.py write delayed
      - name: Verify duplex connection and normal wallet response
        if: "!cancelled() && steps.qt.outcome == 'success'"
        shell: bash
        run: python .github/ci-payment-qt-comparison.py duplex normal
      - name: Verify duplex connection and delayed wallet response
        if: "!cancelled() && steps.qt.outcome == 'success'"
        shell: bash
        run: python .github/ci-payment-qt-comparison.py duplex delayed
