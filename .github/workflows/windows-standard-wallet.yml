name: Windows package wallet check
on:
  push:
    branches: [qa/windows-standard-wallet-report-20261121]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    name: Windows, msvcrt, test cross-built (published mainnet GUI source observation)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 4
          persist-credentials: false

      - name: Check the published package and test revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = '267f3688ff72c275ebdae46ec9668033eba9579a'
          git merge-base --is-ancestor $source HEAD
          if ($LASTEXITCODE) { throw "Expected product source revision" }
          git diff --exit-code $source HEAD -- src .github/ci-windows-smoke.py .github/ci-windows-installer.py
          if ($LASTEXITCODE) { throw "Application or acceptance source changed" }
          $archive = gh api repos/decryp2kanon/sugarchain-en/actions/artifacts/14695848178 | ConvertFrom-Json
          if ($LASTEXITCODE -or $archive.expired -or $archive.workflow_run.id -ne 44864273197 -or
              $archive.digest -ne 'sha256:bdc20953f24bde5ba4d51d3d7eccf5aab1c73fabab7622c697dc660ac07994e9') {
            throw "Unexpected archive identity"
          }

      - name: Download built executables
        uses: actions/download-artifact@v8
        with:
          name: x86_64-w64-mingw32-executables-44864273197
          github-token: ${{ github.token }}
          run-id: 44864273197
          path: distribution

      - name: Locate the native source tool
        run: |
          $candidates = @('C:\mingw64\bin\gdb.exe', 'C:\msys64\ucrt64\bin\gdb.exe', 'C:\msys64\mingw64\bin\gdb.exe')
          $tool = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (!$tool) {
            & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --needed --noconfirm mingw-w64-ucrt-x86_64-gdb'
            if ($LASTEXITCODE) { throw "The native debugging tools could not be installed" }
            $tool = 'C:\msys64\ucrt64\bin\gdb.exe'
          }
          if (!(Test-Path $tool -PathType Leaf)) { throw "The native debugging tool is missing" }
          & $tool --version
          if ($LASTEXITCODE) { throw "The native debugging tool could not start" }
          "WALLET_SOURCE_GDB=$tool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Observe the normal mainnet Qt wallet lifecycle
        run: py -3 .github/ci-windows-wallet-frames.py
