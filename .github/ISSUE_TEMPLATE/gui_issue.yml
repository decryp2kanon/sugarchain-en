name: Issue or feature request related to the GUI
description: Any report, issue or feature request related to the GUI
labels: [GUI]
body:
- type: checkboxes
  id: acknowledgement
  attributes:
    label: Sugarchain En GUI reports belong in this repository
    description: https://github.com/decryp2kanon/sugarchain-en/issues
    options:
      - label: This report concerns the Sugarchain En GUI
        required: true
- type: textarea
  id: gui-request
  attributes:
    label: Report
  validations:
    required: true
