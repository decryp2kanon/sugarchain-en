name: Windows MSVCRT unit and functional suites for the release package
on:
  push:
    branches: [qa/windows-archive-suites-20261120]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  archive:
    name: Windows archive suites, ${{ matrix.runtime }}, ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runtime: [msvcrt]
        suite: [unit, functional]
        include:
          - runtime: msvcrt
            artifact: x86_64-w64-mingw32-executables-44814542060
    env:
      PYTHONUTF8: 1
      TEST_RUNNER_TIMEOUT_FACTOR: 40
      DIR_UNIT_TEST_DATA: ${{ github.workspace }}/unit_test_data
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9dd2c2b19d89ad9f0b914d3e6797ba7643905ece
      - name: Download published Windows programs
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44814542060
          name: ${{ matrix.artifact }}
      - name: Prepare Windows test environment
        id: prepare
        run: py -3 .github/ci-windows-cross.py prepare_tests
      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: py -3 .github/ci-windows-cross.py run_unit_tests
      - name: Functional tests
        if: matrix.suite == 'functional'
        env:
          TEST_RUNNER_EXTRA: "--timeout-factor=${{ env.TEST_RUNNER_TIMEOUT_FACTOR }} --extended"
        run: py -3 .github/ci-windows-cross.py run_functional_tests
